<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutoría: Transporte de Membrana Celular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; }
    /* Clases de color pre-definidas para evitar problemas con Tailwind JIT */
    .bg-blue-custom { background-color: rgb(30, 58, 138); }
    .bg-green-custom { background-color: rgb(20, 83, 45); }
    .bg-red-custom { background-color: rgb(127, 29, 29); }
    .border-blue-custom { border-color: rgb(59, 130, 246); }
    .border-green-custom { border-color: rgb(34, 197, 94); }
    .border-red-custom { border-color: rgb(239, 68, 68); }
    .ring-blue-custom { --tw-ring-color: rgb(59, 130, 246); }
    .ring-green-custom { --tw-ring-color: rgb(34, 197, 94); }
    .ring-red-custom { --tw-ring-color: rgb(239, 68, 68); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    function TransporteMembranaTutoria() {
      const [seccionActual, setSeccionActual] = useState('inicio');
      const [tiempoRestante, setTiempoRestante] = useState(60);
      const [mostrarGlosario, setMostrarGlosario] = useState(false);
      const [respuestasQuiz, setRespuestasQuiz] = useState({});
      const [notasEstudiante, setNotasEstudiante] = useState('');

      useEffect(() => {
        const timer = setInterval(() => {
          setTiempoRestante(prev => prev > 0 ? prev - 1/60 : 0);
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const glosario = {
        transporte: { termino: 'Transporte', ingles: 'Transport', def: 'Movimiento de sustancias a través de la membrana' },
        difusion: { termino: 'Difusión', ingles: 'Diffusion', def: 'Movimiento de moléculas de mayor a menor concentración' },
        osmosis: { termino: 'Ósmosis', ingles: 'Osmosis', def: 'Difusión del agua a través de membrana semipermeable' },
        gradiente: { termino: 'Gradiente', ingles: 'Gradient', def: 'Diferencia de concentración entre dos zonas' },
        hipotonico: { termino: 'Hipotónico', ingles: 'Hypotonic', def: 'Solución con menor concentración de solutos' },
        hipertonico: { termino: 'Hipertónico', ingles: 'Hypertonic', def: 'Solución con mayor concentración de solutos' },
        isotonico: { termino: 'Isotónico', ingles: 'Isotonic', def: 'Soluciones con igual concentración de solutos' },
        acuaporina: { termino: 'Acuaporina', ingles: 'Aquaporin', def: 'Canal específico para el paso del agua' },
        crenacion: { termino: 'Crenación', ingles: 'Crenation', def: 'Encogimiento de célula en solución hipertónica' },
        lisis: { termino: 'Lisis', ingles: 'Lysis', def: 'Ruptura celular por exceso de agua' },
        carrier: { termino: 'Transportador', ingles: 'Carrier', def: 'Proteína que cambia de forma para transportar' }
      };

      const secciones = [
        { id: 'inicio', titulo: '🎯 Inicio', tiempo: 5 },
        { id: 'conceptos', titulo: '📚 Conceptos', tiempo: 10 },
        { id: 'difusion', titulo: '🔄 Difusión Simple', tiempo: 12 },
        { id: 'facilitada', titulo: '🚪 Dif. Facilitada', tiempo: 10 },
        { id: 'osmosis', titulo: '💧 Ósmosis', tiempo: 12 },
        { id: 'clinica', titulo: '🏥 Casos Clínicos', tiempo: 8 },
        { id: 'evaluacion', titulo: '✅ Evaluación', tiempo: 3 }
      ];

      const casosClinicosData = [
        {
          id: 1,
          titulo: 'El Maratonista Deshidratado',
          paciente: 'Hombre de 28 años',
          sintomas: 'Confusión, calambres musculares, piel seca, taquicardia',
          historia: 'Un corredor de maratón llega a urgencias después de correr 4 horas bajo el sol. Solo bebió agua pura durante la carrera y ahora presenta confusión y calambres severos.',
          pregunta: '¿Qué desequilibrio osmótico tiene este paciente?',
          opciones: [
            { id: 'a', texto: 'Hipernatremia (exceso de sodio)', correcto: false },
            { id: 'b', texto: 'Hiponatremia dilucional (bajo sodio)', correcto: true },
            { id: 'c', texto: 'Hipoglucemia', correcto: false },
            { id: 'd', texto: 'Hipercalemia', correcto: false }
          ],
          explicacion: '¡HIPONATREMIA DILUCIONAL! Al sudar perdió sodio. Al beber solo agua pura diluyó aún más el sodio. Sus células cerebrales absorben agua por ÓSMOSIS causando edema cerebral.',
          conexion: 'La ósmosis es crítica: el agua SIEMPRE va hacia donde hay MÁS solutos. Por eso los sueros de rehidratación tienen sales.',
          tratamiento: 'Suero salino hipertónico controlado'
        },
        {
          id: 2,
          titulo: 'El Paciente Diabético en Crisis',
          paciente: 'Mujer de 55 años con diabetes tipo 2',
          sintomas: 'Poliuria intensa, sed extrema, glucosa 600 mg/dL',
          historia: 'Dejó su medicación hace una semana. Llega orinando constantemente y con sed insaciable.',
          pregunta: '¿Por qué la glucosa alta causa que orine tanto?',
          opciones: [
            { id: 'a', texto: 'La glucosa daña los riñones', correcto: false },
            { id: 'b', texto: 'La glucosa en orina arrastra agua por ósmosis', correcto: true },
            { id: 'c', texto: 'Los riñones eliminan toxinas', correcto: false },
            { id: 'd', texto: 'Reacción alérgica', correcto: false }
          ],
          explicacion: 'La glucosa es un SOLUTO osmóticamente activo que ARRASTRA AGUA hacia la orina. Esto explica las "3 P" de diabetes: Poliuria, Polidipsia, Polifagia.',
          conexion: 'La ósmosis explica los síntomas clásicos de diabetes descompensada.',
          tratamiento: 'Insulina + hidratación con suero fisiológico'
        },
        {
          id: 3,
          titulo: 'El Niño con Fibrosis Quística',
          paciente: 'Niño de 8 años',
          sintomas: 'Infecciones pulmonares recurrentes, moco espeso',
          historia: 'Tos constante con moco espeso. Pruebas genéticas confirman fibrosis quística.',
          pregunta: '¿Qué proteína de transporte está defectuosa?',
          opciones: [
            { id: 'a', texto: 'Acuaporinas', correcto: false },
            { id: 'b', texto: 'Canal de cloro CFTR', correcto: true },
            { id: 'c', texto: 'Canal de sodio', correcto: false },
            { id: 'd', texto: 'Transportador GLUT', correcto: false }
          ],
          explicacion: 'El CANAL DE CLORO CFTR está mutado. Sin Cl⁻, el agua no sigue por ósmosis → moco deshidratado y espeso → infecciones.',
          conexion: 'Un defecto en UN canal de difusión facilitada causa enfermedad sistémica grave.',
          tratamiento: 'Moduladores de CFTR + terapia respiratoria'
        }
      ];

      // Componente Glosario
      const GlosarioFlotante = () => (
        <div style={{
          position: 'fixed',
          right: 0,
          top: '80px',
          width: '320px',
          backgroundColor: '#1e293b',
          borderLeft: '4px solid #10b981',
          boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
          transition: 'transform 0.3s',
          zIndex: 50,
          maxHeight: '100vh',
          overflowY: 'auto',
          transform: mostrarGlosario ? 'translateX(0)' : 'translateX(100%)'
        }}>
          <div style={{ padding: '16px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
              <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: '#10b981' }}>📖 Glosario</h3>
              <button onClick={() => setMostrarGlosario(false)} style={{ color: '#94a3b8', fontSize: '20px', background: 'none', border: 'none', cursor: 'pointer' }}>✕</button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              {Object.entries(glosario).map(([key, value]) => (
                <div key={key} style={{ backgroundColor: '#334155', borderRadius: '8px', padding: '12px', borderLeft: '2px solid #14b8a6' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <span style={{ fontWeight: 'bold', color: '#5eead4' }}>{value.termino}</span>
                    <span style={{ color: '#94a3b8', fontSize: '12px', fontStyle: 'italic' }}>{value.ingles}</span>
                  </div>
                  <p style={{ color: '#94a3b8', fontSize: '12px', marginTop: '4px' }}>{value.def}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      // Barra de progreso
      const BarraProgreso = () => (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, backgroundColor: '#0f172a', borderBottom: '1px solid #334155', padding: '12px', zIndex: 40 }}>
          <div style={{ maxWidth: '1152px', margin: '0 auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                <span style={{ fontSize: '18px', fontWeight: 'bold', color: 'white' }}>🔬 Transporte de Membrana</span>
                <span style={{ color: '#94a3b8', fontSize: '14px' }}>Transporte Pasivo y Difusión</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                <button 
                  onClick={() => setMostrarGlosario(!mostrarGlosario)} 
                  style={{ padding: '4px 12px', backgroundColor: '#059669', borderRadius: '8px', fontSize: '14px', color: 'white', border: 'none', cursor: 'pointer' }}
                >
                  📖 Glosario
                </button>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', backgroundColor: '#1e293b', padding: '4px 12px', borderRadius: '8px' }}>
                  <span style={{ color: '#14b8a6' }}>⏱️</span>
                  <span style={{ fontFamily: 'monospace', color: 'white' }}>{Math.floor(tiempoRestante)}:{String(Math.floor((tiempoRestante % 1) * 60)).padStart(2, '0')}</span>
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: '4px' }}>
              {secciones.map((sec, idx) => (
                <button 
                  key={sec.id} 
                  onClick={() => setSeccionActual(sec.id)}
                  style={{ 
                    flex: 1, 
                    height: '8px', 
                    borderRadius: '9999px', 
                    border: 'none',
                    cursor: 'pointer',
                    backgroundColor: seccionActual === sec.id ? '#14b8a6' : secciones.findIndex(s => s.id === seccionActual) > idx ? '#22c55e' : '#334155'
                  }}
                />
              ))}
            </div>
          </div>
        </div>
      );

      // ═══════════════════════════════════════════════════════════════════
      // SECCIÓN INICIO
      // ═══════════════════════════════════════════════════════════════════
      const SeccionInicio = () => (
        <div className="space-y-6">
          <div className="bg-gradient-to-br from-teal-900 to-emerald-900 rounded-2xl p-6 md:p-8 border border-teal-500">
            <h2 className="text-2xl md:text-3xl font-bold mb-4 text-teal-300">🔄 Transporte a través de la Membrana Celular</h2>
            <p className="text-slate-300 text-lg mb-6">
              ¿Cómo entran y salen las sustancias de la célula? Hoy aprenderemos sobre el <strong className="text-emerald-400">transporte PASIVO</strong>: 
              movimiento sin gasto de energía, siguiendo las leyes de la física.
            </p>
            <div className="grid md:grid-cols-2 gap-6">
              <div className="bg-slate-800 rounded-xl p-5">
                <h3 className="font-bold text-amber-400 mb-3">🎯 Objetivos:</h3>
                <ul className="space-y-2 text-slate-300 text-sm">
                  <li className="flex items-start gap-2"><span className="text-green-400">✓</span><span>Comprender gradientes de concentración</span></li>
                  <li className="flex items-start gap-2"><span className="text-green-400">✓</span><span>Diferenciar difusión simple vs facilitada</span></li>
                  <li className="flex items-start gap-2"><span className="text-green-400">✓</span><span>Dominar ósmosis y tonicidad</span></li>
                  <li className="flex items-start gap-2"><span className="text-green-400">✓</span><span>Aplicar a casos clínicos reales</span></li>
                </ul>
              </div>
              <div className="bg-slate-800 rounded-xl p-5">
                <h3 className="font-bold text-pink-400 mb-3">💡 Pregunta inicial:</h3>
                <div className="bg-slate-700 rounded-lg p-4 border-l-4 border-pink-500">
                  <p className="text-white font-medium mb-2">Si pones perfume en una esquina...</p>
                  <p className="text-slate-300 text-sm">¿Por qué lo hueles en toda la habitación aunque no haya viento?</p>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-slate-800 rounded-xl p-6">
            <h3 className="text-xl font-bold mb-4 text-white">🗺️ Mapa del Transporte Celular</h3>
            <svg viewBox="0 0 700 250" className="w-full bg-slate-900 rounded-xl p-2">
              <rect x="250" y="10" width="200" height="40" rx="10" fill="#0d9488" />
              <text x="350" y="35" textAnchor="middle" fill="white" fontSize="12" fontWeight="bold">TRANSPORTE DE MEMBRANA</text>
              <line x1="300" y1="50" x2="175" y2="80" stroke="#4ade80" strokeWidth="2" />
              <line x1="400" y1="50" x2="525" y2="80" stroke="#94a3b8" strokeWidth="2" />
              <rect x="75" y="80" width="200" height="35" rx="8" fill="#22c55e" />
              <text x="175" y="102" textAnchor="middle" fill="white" fontSize="11" fontWeight="bold">TRANSPORTE PASIVO (sin ATP)</text>
              <rect x="425" y="80" width="200" height="35" rx="8" fill="#64748b" opacity="0.5" />
              <text x="525" y="102" textAnchor="middle" fill="#94a3b8" fontSize="11">TRANSPORTE ACTIVO (próxima)</text>
              <line x1="100" y1="115" x2="80" y2="140" stroke="#4ade80" strokeWidth="2" />
              <line x1="175" y1="115" x2="175" y2="140" stroke="#4ade80" strokeWidth="2" />
              <line x1="250" y1="115" x2="270" y2="140" stroke="#4ade80" strokeWidth="2" />
              <rect x="20" y="140" width="120" height="50" rx="6" fill="#3b82f6" />
              <text x="80" y="162" textAnchor="middle" fill="white" fontSize="10" fontWeight="bold">Difusión Simple</text>
              <text x="80" y="176" textAnchor="middle" fill="#93c5fd" fontSize="8">O₂, CO₂, gases</text>
              <rect x="115" y="140" width="120" height="50" rx="6" fill="#8b5cf6" />
              <text x="175" y="162" textAnchor="middle" fill="white" fontSize="10" fontWeight="bold">Dif. Facilitada</text>
              <text x="175" y="176" textAnchor="middle" fill="#c4b5fd" fontSize="8">Canales, carriers</text>
              <rect x="210" y="140" width="120" height="50" rx="6" fill="#06b6d4" />
              <text x="270" y="162" textAnchor="middle" fill="white" fontSize="10" fontWeight="bold">Ósmosis</text>
              <text x="270" y="176" textAnchor="middle" fill="#a5f3fc" fontSize="8">Difusión del agua</text>
              <rect x="20" y="200" width="310" height="20" rx="4" fill="#10b981" fillOpacity="0.2" stroke="#10b981" strokeDasharray="4,2" />
              <text x="175" y="214" textAnchor="middle" fill="#10b981" fontSize="9" fontWeight="bold">📍 HOY APRENDEMOS ESTO</text>
            </svg>
          </div>

          <button 
            onClick={() => setSeccionActual('conceptos')} 
            className="w-full py-4 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 rounded-xl font-bold text-lg transition-all"
          >
            Comenzar la sesión →
          </button>
        </div>
      );

      // ═══════════════════════════════════════════════════════════════════
      // SECCIÓN CONCEPTOS
      // ═══════════════════════════════════════════════════════════════════
      const SeccionConceptos = useMemo(() => function SeccionConceptos() {
        const [respGrad, setRespGrad] = useState(null);

        const handleRespuesta = (opcion) => {
          setRespGrad(opcion);
        };

        return (
          <div className="space-y-6">
            <div className="bg-slate-800 rounded-2xl p-6">
              <h2 className="text-2xl font-bold mb-6 text-teal-300">📚 Conceptos Fundamentales</h2>
              
              <div className="bg-gradient-to-r from-blue-900 to-purple-900 rounded-xl p-6 border border-blue-500 mb-6">
                <h3 className="text-xl font-bold text-blue-400 mb-4">📊 ¿Qué es un GRADIENTE de concentración?</h3>
                <div className="grid md:grid-cols-2 gap-6">
                  <div>
                    <p className="text-slate-300 mb-4">
                      Es la <strong className="text-blue-300">diferencia de concentración</strong> entre dos regiones. 
                      Las moléculas se mueven aleatoriamente, pero estadísticamente van de donde hay MUCHAS a donde hay POCAS.
                    </p>
                    <div className="bg-slate-800 rounded-lg p-4">
                      <p className="text-amber-400 font-bold mb-2">⚡ Regla fundamental:</p>
                      <p className="text-white text-center"><span className="text-green-400">A FAVOR</span> del gradiente = Sin energía</p>
                      <p className="text-white text-center mt-1"><span className="text-red-400">EN CONTRA</span> del gradiente = Requiere ATP</p>
                    </div>
                  </div>
                  <svg viewBox="0 0 300 140" className="w-full bg-slate-900 rounded-xl">
                    <rect x="20" y="20" width="260" height="100" rx="8" fill="none" stroke="#475569" strokeWidth="2" />
                    <line x1="150" y1="20" x2="150" y2="120" stroke="#475569" strokeWidth="2" strokeDasharray="5,5" />
                    {[35,55,75,95,45,65,85,50,70,90,60,80].map((x,i) => <circle key={i} cx={x} cy={35+(i%4)*22} r="7" fill="#3b82f6" opacity="0.8" />)}
                    {[175,215].map((x,i) => <circle key={`r${i}`} cx={x} cy={55+i*30} r="7" fill="#3b82f6" opacity="0.8" />)}
                    <path d="M 130 70 L 165 70" stroke="#22c55e" strokeWidth="3" markerEnd="url(#arrConc)" />
                    <defs><marker id="arrConc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22c55e"/></marker></defs>
                    <text x="75" y="135" textAnchor="middle" fill="#93c5fd" fontSize="9">ALTA conc.</text>
                    <text x="220" y="135" textAnchor="middle" fill="#93c5fd" fontSize="9">BAJA conc.</text>
                  </svg>
                </div>
              </div>

              <div className="bg-gradient-to-r from-pink-900 to-rose-900 rounded-xl p-6 border border-pink-500 mb-6">
                <h3 className="text-lg font-bold text-pink-400 mb-3">🌸 Analogía: El Perfume</h3>
                <div className="grid md:grid-cols-3 gap-4">
                  <div className="bg-slate-800 rounded-lg p-4 text-center">
                    <div className="text-3xl mb-2">💨</div>
                    <p className="text-white font-medium">Inicio</p>
                    <p className="text-slate-400 text-sm">Concentrado en un punto</p>
                  </div>
                  <div className="bg-slate-800 rounded-lg p-4 text-center">
                    <div className="text-3xl mb-2">🔄</div>
                    <p className="text-white font-medium">Proceso</p>
                    <p className="text-slate-400 text-sm">Movimiento aleatorio</p>
                  </div>
                  <div className="bg-slate-800 rounded-lg p-4 text-center">
                    <div className="text-3xl mb-2">✨</div>
                    <p className="text-white font-medium">Resultado</p>
                    <p className="text-slate-400 text-sm">Distribución uniforme</p>
                  </div>
                </div>
                <p className="text-center text-pink-300 mt-4 font-medium">¡Esto es DIFUSIÓN! De mayor a menor concentración hasta el equilibrio.</p>
              </div>

              <div className="bg-slate-700 rounded-xl p-6">
                <h3 className="text-lg font-bold text-emerald-400 mb-4">✅ Características del Transporte PASIVO</h3>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  {[
                    { icon: '⬇️', titulo: 'A favor del gradiente', desc: 'Mayor → menor conc.' },
                    { icon: '🔋', titulo: 'Sin ATP', desc: 'Energía del gradiente' },
                    { icon: '📈', titulo: 'Espontáneo', desc: 'Ocurre naturalmente' },
                    { icon: '⚖️', titulo: 'Busca equilibrio', desc: 'Iguala concentraciones' }
                  ].map((item, idx) => (
                    <div key={idx} className="bg-slate-800 rounded-lg p-4 text-center border border-slate-600">
                      <div className="text-2xl mb-2">{item.icon}</div>
                      <p className="font-bold text-emerald-300 text-sm">{item.titulo}</p>
                      <p className="text-slate-400 text-xs mt-1">{item.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Quiz de verificación con estado local */}
            <div className="bg-slate-800 rounded-xl p-6">
              <h3 className="text-lg font-bold text-amber-400 mb-4">🧠 Verificación rápida</h3>
              <div className="bg-slate-700 rounded-lg p-4">
                <p className="text-white mb-4">Si hay 100 moléculas afuera y 20 adentro, ¿hacia dónde difunden?</p>
                <div className="grid grid-cols-2 gap-3">
                  {['Hacia afuera', 'Hacia adentro', 'No se mueven', 'Ambas igual'].map((op) => {
                    let bgColor = '#475569'; // slate-600
                    if (respGrad === op) {
                      bgColor = op === 'Hacia adentro' ? '#16a34a' : '#dc2626'; // green-600 or red-600
                    }
                    return (
                      <button 
                        key={op} 
                        onClick={() => handleRespuesta(op)}
                        style={{ 
                          padding: '12px', 
                          borderRadius: '8px', 
                          backgroundColor: bgColor,
                          color: 'white',
                          border: 'none',
                          cursor: 'pointer',
                          transition: 'background-color 0.2s'
                        }}
                        onMouseOver={(e) => { if (!respGrad) e.target.style.backgroundColor = '#64748b'; }}
                        onMouseOut={(e) => { if (!respGrad) e.target.style.backgroundColor = '#475569'; }}
                      >
                        {op}
                      </button>
                    );
                  })}
                </div>
                {respGrad === 'Hacia adentro' && (
                  <div className="mt-4 bg-green-900 border border-green-500 rounded-lg p-3">
                    <p className="text-green-300">¡Correcto! Van de 100 (afuera) hacia 20 (adentro).</p>
                  </div>
                )}
                {respGrad && respGrad !== 'Hacia adentro' && (
                  <div className="mt-4 bg-red-900 border border-red-500 rounded-lg p-3">

          const nuevasParticulas = Array.from({length: 25}, (_, i) => ({
            id: i, 
            x: 30 + Math.random() * 100, 
            y: 30 + Math.random() * 120, 
            vx: (Math.random() - 0.5) * 4, 
            vy: (Math.random() - 0.5) * 4
          }));
          setParticulas(nuevasParticulas);
          setSimActivo(true);
        }, []);

        const detenerSimulacion = useCallback(() => {
          setSimActivo(false);

        // Efecto para animar partículas
        useEffect(() => {
          if (!simActivo || particulas.length === 0) return;

          const interval = setInterval(() => {
            setParticulas(prevParticulas => 
              prevParticulas.map(p => {
                let nx = p.x + p.vx + (Math.random() - 0.5) * 2;
                let ny = p.y + p.vy + (Math.random() - 0.5) * 2;
                let nvx = p.vx;
                let nvy = p.vy;

                // Rebotar en paredes
                if (nx < 20) { nvx = Math.abs(nvx); nx = 20; }
                if (nx > 380) { nvx = -Math.abs(nvx); nx = 380; }
                if (ny < 25) { nvy = Math.abs(nvy); ny = 25; }
                if (ny > 175) { nvy = -Math.abs(nvy); ny = 175; }

                // Fricción
                nvx *= 0.99;
                nvy *= 0.99;

                return { ...p, x: nx, y: ny, vx: nvx, vy: nvy };
              })
            );
            setTick(t => t + 1);
          }, 50);

          return () => clearInterval(interval);

              <p className="text-slate-300">Aplica tus conocimientos a situaciones médicas reales.</p>
            </div>

            <div className="bg-slate-800 rounded-2xl p-6">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <span className="text-xs bg-red-600 px-2 py-1 rounded-full text-white">Caso {casoIdx + 1}/{casosClinicosData.length}</span>
                  <h3 className="text-xl font-bold text-white mt-2">{caso.titulo}</h3>
                </div>
                <span className="text-4xl">🏥</span>
              </div>

              <div className="bg-slate-700 rounded-xl p-4 mb-4">
                <p className="text-slate-300 mb-2"><strong className="text-white">Paciente:</strong> {caso.paciente}</p>
                <p className="text-slate-300 mb-2">{caso.historia}</p>
                <div className="bg-slate-800 rounded-lg p-3 mt-3">
                  <p className="text-pink-400 text-sm font-medium">Síntomas: <span className="text-slate-300">{caso.sintomas}</span></p>
                </div>
              </div>

              <div className="bg-teal-900 rounded-xl p-4 mb-4 border border-teal-500">
                <p className="text-teal-300 font-medium mb-3">❓ {caso.pregunta}</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {caso.opciones.map(op => {
                    let bgColor = '#475569'; // default slate-600
                    if (respuesta !== null) {
                      if (op.correcto) {
                        bgColor = '#16a34a'; // green
                      } else if (respuesta === op.id) {
                        bgColor = '#dc2626'; // red
                      }
                    }
                    return (
                      <button 
                        key={op.id}
                        onClick={() => handleRespuesta(op.id)}
                        disabled={respuesta !== null}
                        style={{
                          padding: '12px',
                          borderRadius: '8px',
                          backgroundColor: bgColor,
                          color: 'white',
                          border: 'none',
                          cursor: respuesta !== null ? 'default' : 'pointer',
                          textAlign: 'left',
                          transition: 'background-color 0.2s',
                          opacity: respuesta !== null && !op.correcto && respuesta !== op.id ? 0.6 : 1
                        }}
                      >
                        {op.id}) {op.texto}
                      </button>
                    );
                  })}
                </div>
              </div>

              {respuesta && (
                <div className="space-y-4">
                  <div className={`rounded-xl p-4 border ${caso.opciones.find(o => o.id === respuesta)?.correcto ? 'bg-green-900 border-green-500' : 'bg-amber-900 border-amber-500'}`}>
                    <h4 className="font-bold mb-2 text-white">
                      {caso.opciones.find(o => o.id === respuesta)?.correcto ? '✓ ¡Correcto!' : '📚 Explicación:'}
                    </h4>
                    <p className="text-slate-200">{caso.explicacion}</p>
                  </div>

                  <div className="bg-purple-900 rounded-xl p-4 border border-purple-500">
                    <p className="text-purple-300 font-bold">🔗 Conexión con transporte:</p>
                    <p className="text-slate-200">{caso.conexion}</p>
                  </div>

                  <div className="bg-teal-900 rounded-xl p-4 border border-teal-500">
                    <p className="text-teal-300 font-bold">💊 Tratamiento:</p>
                    <p className="text-slate-200">{caso.tratamiento}</p>
                  </div>

                  {casoIdx < casosClinicosData.length - 1 ? (
                    <button 
                      onClick={siguienteCaso}
                      className="w-full py-3 bg-teal-600 hover:bg-teal-500 rounded-xl transition-all font-medium"
                    >
                      Siguiente caso →
                    </button>
                  ) : (
                    <button 
                      onClick={() => setSeccionActual('evaluacion')}
                      className="w-full py-3 bg-green-600 hover:bg-green-500 rounded-xl transition-all font-medium"
                    >
                      Ir a Evaluación Final →
                    </button>
                  )}
                </div>
              )}
            </div>

            <button onClick={() => setSeccionActual('osmosis')} className="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all">
              ← Volver a Ósmosis
            </button>
          </div>
        );
      }, []);

      // ═══════════════════════════════════════════════════════════════════
      // SECCIÓN EVALUACIÓN
      // ═══════════════════════════════════════════════════════════════════
      const SeccionEvaluacion = useMemo(() => function SeccionEvaluacion() {
        const [respuestas, setRespuestas] = useState({});
        const [mostrarResultados, setMostrarResultados] = useState(false);

        const preguntas = [
          { id: 1, q: '¿Qué caracteriza al transporte PASIVO?', ops: [{id:'a',t:'Requiere ATP',c:false},{id:'b',t:'No requiere ATP, va a favor del gradiente',c:true},{id:'c',t:'Solo transporta agua',c:false},{id:'d',t:'Siempre necesita proteínas',c:false}]},
          { id: 2, q: '¿Qué moléculas pasan por difusión SIMPLE?', ops: [{id:'a',t:'Glucosa',c:false},{id:'b',t:'Iones',c:false},{id:'c',t:'O₂ y CO₂',c:true},{id:'d',t:'Proteínas',c:false}]},
          { id: 3, q: 'Diferencia entre canales y carriers:', ops: [{id:'a',t:'Canales usan ATP',c:false},{id:'b',t:'Canales son poros rápidos; carriers cambian forma',c:true},{id:'c',t:'Son iguales',c:false},{id:'d',t:'Solo carriers transportan iones',c:false}]},
          { id: 4, q: 'En solución hipotónica, un glóbulo rojo:', ops: [{id:'a',t:'Se encoge',c:false},{id:'b',t:'Se hincha y puede reventar',c:true},{id:'c',t:'No cambia',c:false},{id:'d',t:'Se deshidrata',c:false}]},
          { id: 5, q: '¿Qué son las acuaporinas?', ops: [{id:'a',t:'Enzimas digestivas',c:false},{id:'b',t:'Canales específicos para agua',c:true},{id:'c',t:'Transportadores de glucosa',c:false},{id:'d',t:'Bombas de sodio',c:false}]},
          { id: 6, q: 'Maratonista confundido tras beber solo agua:', ops: [{id:'a',t:'Deshidratación severa',c:false},{id:'b',t:'Hiponatremia dilucional',c:true},{id:'c',t:'Hipernatremia',c:false},{id:'d',t:'Hipoglucemia',c:false}]},
        ];

        const handleRespuesta = (preguntaId, opcionId) => {
          if (!mostrarResultados) {
            setRespuestas({...respuestas, [preguntaId]: opcionId});
          }
        };

        const puntaje = preguntas.filter(p => {
          const correcta = p.ops.find(o => o.c);
          return respuestas[p.id] === correcta?.id;
        }).length;

        const reiniciar = () => {
          setRespuestas({});
          setMostrarResultados(false);
        };

        return (
          <div className="space-y-6">
            <div className="bg-gradient-to-br from-green-900 to-emerald-900 rounded-2xl p-6 border border-green-500">
              <h2 className="text-2xl font-bold text-green-300">✅ Evaluación Final</h2>
              <p className="text-slate-300">Verifica lo que aprendiste en esta sesión.</p>
            </div>

            {preguntas.map((p, i) => (
              <div key={p.id} className="bg-slate-800 rounded-xl p-5">
                <p className="text-white mb-4"><span className="text-teal-400 font-bold">{i+1}.</span> {p.q}</p>
                <div className="space-y-2">
                  {p.ops.map(op => {
                    let bgColor = '#334155'; // slate-700
                    if (mostrarResultados) {
                      if (op.c) {
                        bgColor = '#16a34a'; // green
                      } else if (respuestas[p.id] === op.id) {
                        bgColor = '#dc2626'; // red
                      }
                    } else if (respuestas[p.id] === op.id) {
                      bgColor = '#0d9488'; // teal
                    }

                    return (
                      <button 
                        key={op.id}
                        onClick={() => handleRespuesta(p.id, op.id)}
                        disabled={mostrarResultados}
                        style={{
                          width: '100%',
                          padding: '12px',
                          borderRadius: '8px',
                          backgroundColor: bgColor,
                          color: 'white',
                          border: 'none',
                          cursor: mostrarResultados ? 'default' : 'pointer',
                          textAlign: 'left',
                          transition: 'background-color 0.2s'
                        }}
                      >
                        {op.id}) {op.t} {mostrarResultados && op.c && '✓'}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}

            <div className="flex justify-center">
              {!mostrarResultados ? (
                <button 
                  onClick={() => setMostrarResultados(true)}
                  disabled={Object.keys(respuestas).length < preguntas.length}
                  style={{
                    padding: '16px 32px',
                    borderRadius: '12px',
                    backgroundColor: Object.keys(respuestas).length < preguntas.length ? '#475569' : '#16a34a',
                    color: 'white',
                    border: 'none',
                    cursor: Object.keys(respuestas).length < preguntas.length ? 'not-allowed' : 'pointer',
                    fontWeight: 'bold',
                    fontSize: '18px'
                  }}
                >
                  Ver Resultados ({Object.keys(respuestas).length}/{preguntas.length})
                </button>
              ) : (
                <div className="text-center bg-slate-800 rounded-xl p-6 w-full">
                  <div className="text-5xl font-bold mb-3 text-white">{puntaje}/{preguntas.length}</div>
                  <p className="text-2xl mb-4">
                    {puntaje === preguntas.length ? '🎉 ¡PERFECTO!' : puntaje >= 4 ? '👏 ¡Muy bien!' : '💪 Sigue practicando'}
                  </p>
                  <div className="bg-slate-700 rounded-xl p-4 text-left">
                    <h4 className="font-bold text-teal-400 mb-2">📋 Aprendido hoy:</h4>
                    <ul className="text-slate-300 text-sm space-y-1">
                      <li>✓ Gradiente de concentración</li>
                      <li>✓ Difusión simple vs facilitada</li>
                      <li>✓ Canales vs transportadores</li>
                      <li>✓ Ósmosis y tonicidad</li>
                      <li>✓ Aplicaciones clínicas</li>
                    </ul>
                  </div>
                  <button 
                    onClick={reiniciar}
                    className="mt-4 px-6 py-3 bg-slate-600 hover:bg-slate-500 rounded-xl transition-all"
                  >
                    🔄 Intentar de nuevo
                  </button>
                </div>
              )}
            </div>

            <div className="flex gap-4">
              <button onClick={() => setSeccionActual('clinica')} className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all">← Casos Clínicos</button>
              <button onClick={() => setSeccionActual('inicio')} className="flex-1 py-3 bg-teal-600 hover:bg-teal-500 rounded-xl transition-all">🏠 Inicio</button>
            </div>
          </div>
        );
      }, []);

      // ═══════════════════════════════════════════════════════════════════
      // RENDER PRINCIPAL
      // ═══════════════════════════════════════════════════════════════════
      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 text-white">
          <BarraProgreso />
          <GlosarioFlotante />
          
          <div style={{ paddingTop: '96px', paddingBottom: '80px', paddingLeft: '16px', paddingRight: '16px', maxWidth: '896px', margin: '0 auto' }}>
            {seccionActual === 'inicio' && <SeccionInicio />}
            {seccionActual === 'conceptos' && <SeccionConceptos />}
            {seccionActual === 'difusion' && <SeccionDifusion />}
            {seccionActual === 'facilitada' && <SeccionFacilitada />}
            {seccionActual === 'osmosis' && <SeccionOsmosis />}
            {seccionActual === 'clinica' && <SeccionClinica />}
            {seccionActual === 'evaluacion' && <SeccionEvaluacion />}
          </div>

          {/* Footer */}
          <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, backgroundColor: 'rgba(15, 23, 42, 0.95)', borderTop: '1px solid #334155', padding: '12px' }}>
            <div style={{ maxWidth: '896px', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', flex: 1 }}>
                <span style={{ color: '#94a3b8', fontSize: '14px' }}>📝</span>
                <input 
                  type="text" 
                  value={notasEstudiante} 
                  onChange={e => setNotasEstudiante(e.target.value)} 
                  placeholder="Tus notas aquí..."
                  style={{
                    flex: 1,
                    maxWidth: '400px',
                    backgroundColor: '#1e293b',
                    border: '1px solid #475569',
                    borderRadius: '8px',
                    padding: '4px 12px',
                    fontSize: '14px',
                    color: 'white'
                  }}
                />
              </div>
              <span style={{ color: '#64748b', fontSize: '12px' }}>Biología Celular | Transporte Pasivo</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<TransporteMembranaTutoria />, document.getElementById('root'));
  </script>
</body>
</html>
