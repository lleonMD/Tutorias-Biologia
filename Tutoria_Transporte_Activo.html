<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutoría Interactiva: Transporte Activo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-card: #111827;
    --bg-card-alt: #1a2236;
    --accent-primary: #06d6a0;
    --accent-secondary: #118ab2;
    --accent-warm: #ef476f;
    --accent-gold: #ffd166;
    --accent-purple: #8338ec;
    --text-primary: #e8edf5;
    --text-secondary: #8b99b0;
    --border-subtle: #1e2a42;
    --gradient-pump: linear-gradient(135deg, #06d6a0, #118ab2);
    --gradient-warm: linear-gradient(135deg, #ef476f, #ffd166);
    --gradient-cool: linear-gradient(135deg, #8338ec, #118ab2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .app-container { max-width: 960px; margin: 0 auto; padding: 16px; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 50%, #0d1b2a 100%);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(6,214,160,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-title {
    font-size: 1.6rem;
    font-weight: 800;
    background: var(--gradient-pump);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .header-subtitle { color: var(--text-secondary); font-size: 0.9rem; }

  /* Progress Bar */
  .progress-container {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 20px;
    border: 1px solid var(--border-subtle);
  }
  .progress-label {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .progress-bar {
    height: 6px;
    background: #1e2a42;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gradient-pump);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  /* Navigation Pills */
  .nav-pills {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-primary) transparent;
  }
  .nav-pill {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .nav-pill:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
  .nav-pill.active {
    background: var(--gradient-pump);
    color: #000;
    border-color: transparent;
  }
  .nav-pill.completed {
    background: rgba(6,214,160,0.15);
    border-color: var(--accent-primary);
    color: var(--accent-primary);
  }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .card-highlight {
    border-left: 3px solid var(--accent-primary);
  }
  .card-warm { border-left: 3px solid var(--accent-warm); }
  .card-gold { border-left: 3px solid var(--accent-gold); }
  .card-purple { border-left: 3px solid var(--accent-purple); }
  .card h2 {
    font-size: 1.35rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card h3 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; font-size: 0.92rem; }
  .section-icon { font-size: 1.5rem; margin-bottom: 8px; display: block; }

  /* Key concept box */
  .key-concept {
    background: rgba(6,214,160,0.08);
    border: 1px solid rgba(6,214,160,0.25);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 0;
  }
  .key-concept .label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent-primary);
    margin-bottom: 6px;
  }
  .key-concept p { color: var(--text-primary); font-size: 0.9rem; margin: 0; }
  .key-concept-warm {
    background: rgba(239,71,111,0.08);
    border-color: rgba(239,71,111,0.25);
  }
  .key-concept-warm .label { color: var(--accent-warm); }
  .key-concept-gold {
    background: rgba(255,209,102,0.08);
    border-color: rgba(255,209,102,0.25);
  }
  .key-concept-gold .label { color: var(--accent-gold); }
  .key-concept-purple {
    background: rgba(131,56,236,0.08);
    border-color: rgba(131,56,236,0.25);
  }
  .key-concept-purple .label { color: var(--accent-purple); }

  /* Tables */
  .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85rem; margin: 12px 0; }
  .data-table th {
    background: var(--bg-card-alt);
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    color: var(--accent-primary);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .data-table th:first-child { border-radius: 8px 0 0 0; }
  .data-table th:last-child { border-radius: 0 8px 0 0; }
  .data-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-secondary);
  }
  .data-table tr:hover td { background: rgba(6,214,160,0.04); }

  /* Buttons */
  .btn {
    padding: 12px 24px;
    border-radius: 12px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
    transition: all 0.3s;
  }
  .btn-primary {
    background: var(--gradient-pump);
    color: #000;
  }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-secondary {
    background: var(--bg-card-alt);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
  }
  .btn-secondary:hover { border-color: var(--accent-primary); }
  .nav-buttons { display: flex; gap: 12px; margin-top: 20px; }
  .nav-buttons .btn { flex: 1; text-align: center; }

  /* Quiz Options */
  .quiz-option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 12px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card-alt);
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  .quiz-option:hover:not(.selected):not(.correct):not(.incorrect) {
    border-color: var(--accent-secondary);
    background: rgba(17,138,178,0.1);
  }
  .quiz-option.correct {
    border-color: var(--accent-primary);
    background: rgba(6,214,160,0.15);
    color: var(--accent-primary);
  }
  .quiz-option.incorrect {
    border-color: var(--accent-warm);
    background: rgba(239,71,111,0.1);
    color: var(--accent-warm);
  }
  .quiz-option.selected {
    border-color: var(--accent-secondary);
    background: rgba(17,138,178,0.15);
  }
  .feedback-box {
    padding: 14px 18px;
    border-radius: 12px;
    margin-top: 10px;
    font-size: 0.88rem;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
  }
  .feedback-correct {
    background: rgba(6,214,160,0.1);
    border: 1px solid rgba(6,214,160,0.3);
    color: #a7f3d0;
  }
  .feedback-incorrect {
    background: rgba(239,71,111,0.1);
    border: 1px solid rgba(239,71,111,0.3);
    color: #fca5a5;
  }

  /* Interactive Diagram */
  .diagram-container {
    background: var(--bg-card-alt);
    border-radius: 12px;
    padding: 20px;
    margin: 12px 0;
    text-align: center;
    position: relative;
  }
  .diagram-cell {
    display: inline-block;
    border: 3px solid var(--accent-secondary);
    border-radius: 24px;
    padding: 20px;
    min-width: 280px;
    position: relative;
    background: rgba(17,138,178,0.05);
  }
  .membrane-bar {
    width: 100%;
    height: 12px;
    background: linear-gradient(90deg, #ffd166, #ef476f, #ffd166, #ef476f, #ffd166);
    border-radius: 6px;
    margin: 12px 0;
    position: relative;
  }

  /* Clickable transport items */
  .transport-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.3s;
    margin: 4px;
    font-size: 0.85rem;
  }
  .transport-item:hover {
    border-color: var(--accent-primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(6,214,160,0.15);
  }
  .transport-item.active {
    border-color: var(--accent-primary);
    background: rgba(6,214,160,0.1);
  }

  /* Detail Panel */
  .detail-panel {
    background: var(--bg-card-alt);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 20px;
    margin-top: 12px;
    animation: slideUp 0.3s ease;
  }
  .detail-panel h4 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent-primary);
    margin-bottom: 8px;
  }
  .detail-panel .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 600;
    margin: 2px;
  }
  .tag-green { background: rgba(6,214,160,0.15); color: var(--accent-primary); }
  .tag-blue { background: rgba(17,138,178,0.15); color: var(--accent-secondary); }
  .tag-red { background: rgba(239,71,111,0.15); color: var(--accent-warm); }
  .tag-gold { background: rgba(255,209,102,0.15); color: var(--accent-gold); }
  .tag-purple { background: rgba(131,56,236,0.15); color: var(--accent-purple); }

  /* Clinical case */
  .clinical-case {
    background: linear-gradient(135deg, rgba(239,71,111,0.08), rgba(255,209,102,0.05));
    border: 1px solid rgba(239,71,111,0.2);
    border-radius: 16px;
    padding: 20px;
    margin: 16px 0;
  }
  .clinical-case .case-badge {
    display: inline-block;
    background: var(--accent-warm);
    color: #000;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Objective checklist */
  .obj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .obj-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--bg-card-alt);
    font-size: 0.8rem;
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
  }
  .obj-item.done { border-color: rgba(6,214,160,0.3); background: rgba(6,214,160,0.05); }
  .obj-check { font-size: 1rem; flex-shrink: 0; }

  /* Visual transporter diagram */
  .transporter-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin: 16px 0;
  }
  .transporter-box {
    width: 140px;
    text-align: center;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
  }
  .transporter-box:hover { transform: scale(1.05); }
  .transporter-box .icon { font-size: 2.2rem; margin-bottom: 6px; }
  .transporter-box .name { font-size: 0.82rem; font-weight: 600; }
  .transporter-box .sub { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }

  /* SVG diagrams */
  .svg-diagram { width: 100%; max-width: 500px; margin: 0 auto; display: block; }

  /* Responsive columns */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.4s ease; }

  /* Glucose transcytosis diagram */
  .cell-diagram {
    background: var(--bg-card-alt);
    border-radius: 16px;
    padding: 20px;
    margin: 12px 0;
  }
  .cell-side {
    padding: 12px 16px;
    border-radius: 10px;
    margin: 6px 0;
    text-align: center;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .apical-side {
    background: rgba(255,209,102,0.12);
    border: 1px dashed rgba(255,209,102,0.4);
    color: var(--accent-gold);
  }
  .basolateral-side {
    background: rgba(131,56,236,0.12);
    border: 1px dashed rgba(131,56,236,0.4);
    color: var(--accent-purple);
  }
  .protein-in-membrane {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 16px;
    border-radius: 10px;
    margin: 6px;
    font-size: 0.82rem;
    font-weight: 600;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 3px; }

  @media (max-width: 640px) {
    .two-col, .three-col, .obj-grid { grid-template-columns: 1fr; }
    .header-title { font-size: 1.3rem; }
    .card { padding: 18px; }
  }

  /* Code / mono */
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; }

  /* Score counter */
  .score-display {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(6,214,160,0.1);
    border: 1px solid rgba(6,214,160,0.3);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent-primary);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app-container" id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">⚡ Transporte Activo a Través de la Membrana Plasmática</div>
    <div class="header-subtitle">Tutoría Interactiva — Biología Celular — Primer Año de Medicina</div>
    <div style="margin-top:10px">
      <span class="score-display" id="scoreDisplay">🎯 Puntuación: <span id="scoreValue">0</span>/100</span>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-container">
    <div class="progress-label">
      <span id="progressText">Sección 1 de 9</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <div class="nav-pills" id="navPills"></div>

  <!-- CONTENT SECTIONS -->
  <div id="sectionContent"></div>

</div>

<script>
// ============================================
//  STATE MANAGEMENT
// ============================================
const state = {
  currentSection: 0,
  score: 0,
  completedSections: new Set(),
  answers: {},
  selectedBomb: null,
  selectedTransporter: null,
  expandedDetails: {}
};

const sections = [
  { id: 'inicio', title: '🎯 Inicio', short: 'Inicio' },
  { id: 'definicion', title: '📖 Definición', short: 'Definición' },
  { id: 'mecanismos', title: '🔄 Simporte/Antiporte', short: 'Sim/Anti/Uni' },
  { id: 'primario', title: '⚡ T.A. Primario', short: 'Primario' },
  { id: 'bombas', title: '🔬 Bombas P/V/F/ABC', short: 'Bombas' },
  { id: 'secundario', title: '🔗 T.A. Secundario', short: 'Secundario' },
  { id: 'glucosa', title: '🩸 Transcitosis Glucosa', short: 'Glucosa' },
  { id: 'cftr', title: '🫁 CFTR', short: 'CFTR' },
  { id: 'evaluacion', title: '✅ Evaluación Final', short: 'Evaluación' }
];

// ============================================
//  RENDER ENGINE
// ============================================
function navigateTo(idx) {
  if (idx >= 0 && idx < sections.length) {
    if (state.currentSection < idx) {
      state.completedSections.add(state.currentSection);
    }
    state.currentSection = idx;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function addScore(points, key) {
  if (!state.answers[key]) {
    state.answers[key] = true;
    state.score += points;
    document.getElementById('scoreValue').textContent = state.score;
  }
}

function render() {
  renderNav();
  renderProgress();
  renderSection();
}

function renderNav() {
  const container = document.getElementById('navPills');
  container.innerHTML = sections.map((s, i) => {
    let cls = 'nav-pill';
    if (i === state.currentSection) cls += ' active';
    else if (state.completedSections.has(i)) cls += ' completed';
    return `<button class="${cls}" onclick="navigateTo(${i})">${s.short}</button>`;
  }).join('');
}

function renderProgress() {
  const pct = Math.round((state.currentSection / (sections.length - 1)) * 100);
  document.getElementById('progressText').textContent = `Sección ${state.currentSection + 1} de ${sections.length}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderSection() {
  const container = document.getElementById('sectionContent');
  const renderers = [
    renderInicio, renderDefinicion, renderMecanismos, renderPrimario,
    renderBombas, renderSecundario, renderGlucosa, renderCFTR, renderEvaluacion
  ];
  container.innerHTML = '<div class="fade-in">' + renderers[state.currentSection]() + '</div>';
}

function navButtons(prevIdx, nextIdx, nextLabel) {
  let html = '<div class="nav-buttons">';
  if (prevIdx !== null) {
    html += `<button class="btn btn-secondary" onclick="navigateTo(${prevIdx})">← Anterior</button>`;
  }
  if (nextIdx !== null) {
    html += `<button class="btn btn-primary" onclick="navigateTo(${nextIdx})">${nextLabel || 'Siguiente →'}</button>`;
  }
  html += '</div>';
  return html;
}

function quizOption(quizId, optionId, text, isCorrect, explanation) {
  const answeredKey = 'quiz_' + quizId;
  const answered = state.answers[answeredKey + '_answered'];
  let cls = 'quiz-option';
  if (answered) {
    if (optionId === state.answers[answeredKey + '_selected']) {
      cls += isCorrect ? ' correct' : ' incorrect';
    }
    if (isCorrect) cls += ' correct';
  }
  return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="handleQuiz('${quizId}','${optionId}',${isCorrect}, \`${explanation.replace(/`/g,"'")}\`)">${text}</button>`;
}

function handleQuiz(quizId, optionId, isCorrect, explanation) {
  const key = 'quiz_' + quizId;
  if (state.answers[key + '_answered']) return;
  state.answers[key + '_answered'] = true;
  state.answers[key + '_selected'] = optionId;
  if (isCorrect) addScore(10, key);
  state.answers[key + '_explanation'] = explanation;
  state.answers[key + '_correct'] = isCorrect;
  render();
}

function quizFeedback(quizId) {
  const key = 'quiz_' + quizId;
  if (!state.answers[key + '_answered']) return '';
  const correct = state.answers[key + '_correct'];
  const expl = state.answers[key + '_explanation'];
  return `<div class="feedback-box ${correct ? 'feedback-correct' : 'feedback-incorrect'}">
    ${correct ? '✅ ¡Correcto!' : '❌ No es la respuesta correcta.'} ${expl}
  </div>`;
}

function toggleDetail(id) {
  state.expandedDetails[id] = !state.expandedDetails[id];
  render();
}

function selectBomb(type) {
  state.selectedBomb = state.selectedBomb === type ? null : type;
  render();
}

function selectTransporter(type) {
  state.selectedTransporter = state.selectedTransporter === type ? null : type;
  render();
}

// ============================================
//  SECTION: INICIO
// ============================================
function renderInicio() {
  return `
  <div class="card card-highlight">
    <span class="section-icon">🎯</span>
    <h2>Bienvenido a la Tutoría de Transporte Activo</h2>
    <p>En esta sesión exploraremos cómo las células utilizan energía para mover moléculas en contra de su gradiente de concentración. Conectaremos cada concepto con casos clínicos reales que encontrarás en tu práctica médica.</p>

    <div class="key-concept" style="margin-top:16px">
      <div class="label">Pregunta detonante</div>
      <p>¿Cómo logra una célula del intestino absorber glucosa del lumen intestinal cuando la concentración de glucosa ya es menor en el lumen que dentro de la célula? 🤔</p>
    </div>
  </div>

  <div class="card">
    <h3>📋 Objetivos de la Sesión</h3>
    <div class="obj-grid">

function renderSecundario() {
  return `
  <div class="card card-highlight">
    <span class="section-icon">🔗</span>

  </div>

  <div class="card">
    <div class="key-concept">
      <div class="label">Definición</div>
      <p><strong>T.A. Secundario:</strong> No usa ATP directamente. Aprovecha el <strong>gradiente electroquímico</strong> generado por una bomba primaria (típicamente el gradiente de Na⁺) para cotransportar otro soluto contra su gradiente. Es llamado también <strong>cotransporte</strong>.</p>
    </div>

    <div class="key-concept-warm" style="margin-top:12px; padding:14px; border-radius:10px; background:rgba(239,71,111,0.08); border:1px solid rgba(239,71,111,0.2);">

      <p style="color:var(--text-primary); font-size:0.9rem; margin:0;">El T.A. secundario depende <strong>indirectamente</strong> del ATP: la Na⁺/K⁺-ATPasa (primaria) genera el gradiente de Na⁺ que luego es aprovechado por simportadores y antiportadores. Si se inhibe la bomba primaria (ej. con ouabaína), ¡el transporte secundario también se detiene!</p>

  </div>

  <div class="card">
    <h3>🔄 Relación Primario → Secundario</h3>

      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">

          <strong style="color:var(--accent-warm)">Na⁺/K⁺-ATPasa (PRIMARIA)</strong><br>
          <span style="font-size:0.82rem; color:var(--text-secondary)">ATP → 3Na⁺ fuera / 2K⁺ dentro</span>
        </div>
        <div style="font-size:1.5rem;">⬇️</div>
        <div style="background:rgba(6,214,160,0.12); padding:10px 20px; border-radius:10px; border:1px solid rgba(6,214,160,0.3); text-align:center;">
          <strong style="color:var(--accent-primary)">Gradiente de Na⁺ (alto fuera, bajo dentro)</strong>
        </div>
        <div style="font-size:1.5rem;">⬇️</div>
        <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
          <div style="background:rgba(17,138,178,0.12); padding:10px 16px; border-radius:10px; border:1px solid rgba(17,138,178,0.3); text-align:center;">
            <strong style="color:var(--accent-secondary)">Simporte</strong><br>
            <span style="font-size:0.8rem; color:var(--text-secondary)">Na⁺ + glucosa (SGLT1)</span>
          </div>
          <div style="background:rgba(131,56,236,0.12); padding:10px 16px; border-radius:10px; border:1px solid rgba(131,56,236,0.3); text-align:center;">
            <strong style="color:var(--accent-purple)">Antiporte</strong><br>
            <span style="font-size:0.8rem; color:var(--text-secondary)">Na⁺ ↔ Ca²⁺ (NCX)</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>📋 Ejemplos Importantes de T.A. Secundario</h3>
    <table class="data-table">
      <thead>
        <tr><th>Transportador</th><th>Tipo</th><th>Solutos</th><th>Ubicación</th><th>Relevancia</th></tr>
      </thead>
      <tbody>
        <tr><td>SGLT1</td><td style="color:var(--accent-secondary)">Simporte</td><td>Na⁺ + glucosa</td><td>Intestino delgado (apical)</td><td>Absorción intestinal de glucosa</td></tr>
        <tr><td>SGLT2</td><td style="color:var(--accent-secondary)">Simporte</td><td>Na⁺ + glucosa</td><td>Túbulo proximal (apical)</td><td>Diana de gliflozinas (DM2)</td></tr>
        <tr><td>NKCC2</td><td style="color:var(--accent-secondary)">Simporte</td><td>Na⁺/K⁺/2Cl⁻</td><td>Asa de Henle</td><td>Diana de furosemida</td></tr>
        <tr><td>NCC</td><td style="color:var(--accent-secondary)">Simporte</td><td>Na⁺/Cl⁻</td><td>Túbulo distal</td><td>Diana de tiazidas</td></tr>
        <tr><td>NCX</td><td style="color:var(--accent-warm)">Antiporte</td><td>3Na⁺ ↔ 1Ca²⁺</td><td>Cardiomiocitos</td><td>Regulación Ca²⁺ cardíaco</td></tr>
        <tr><td>NHE3</td><td style="color:var(--accent-warm)">Antiporte</td><td>Na⁺ ↔ H⁺</td><td>Túbulo proximal</td><td>Reabsorción de HCO₃⁻</td></tr>
        <tr><td>Banda 3 (AE1)</td><td style="color:var(--accent-warm)">Antiporte</td><td>Cl⁻ ↔ HCO₃⁻</td><td>Eritrocitos</td><td>Cambio de cloruro (transporte CO₂)</td></tr>
      </tbody>
    </table>

  <!-- QUIZ -->
  <div class="card">
    <h3>🧪 Caso Clínico</h3>
    <div class="clinical-case">

    </div>
    ${quizOption('sec1', 'a', 'A) Se bloquea la reabsorción renal de glucosa → glucosuria → diuresis osmótica', true, 'Correcto: al inhibir SGLT2 en el túbulo proximal, la glucosa no se reabsorbe, se queda en la orina (glucosuria). Esto genera diuresis osmótica (más orina) y pérdida calórica (glucosa perdida → pérdida de peso). Efecto terapéutico deseado.')}
    ${quizOption('sec1', 'b', 'B) Se inhibe la Na⁺/K⁺-ATPasa renal', false, 'La dapagliflozina no inhibe la Na⁺/K⁺-ATPasa directamente, sino el cotransportador SGLT2.')}
    ${quizOption('sec1', 'c', 'C) Se bloquea GLUT2 en el hígado', false, 'GLUT2 hepático es un transportador facilitado, no es el blanco de las gliflozinas.')}
    ${quizOption('sec1', 'd', 'D) Se aumenta la secreción de insulina', false, 'Las gliflozinas no actúan sobre las células beta ni estimulan insulina.')}
    ${quizFeedback('sec1')}
  </div>

  ${navButtons(4, 6, 'Transcitosis Glucosa →')}
  `;
}

function renderGlucosa() {

    <span class="section-icon">🩸</span>

    <p>Obj. 7: Reconocer la localización de transportadores y comprender por qué están así distribuidos.</p>
  </div>

  <div class="card">
    <p>Las células epiteliales del intestino delgado (enterocitos) y del túbulo renal proximal son <strong>polarizadas</strong>: tienen una membrana <strong>apical</strong> (hacia el lumen) y una membrana <strong>basolateral</strong> (hacia la sangre). Los transportadores de glucosa se distribuyen estratégicamente.</p>

    <div class="cell-diagram">
      <div style="text-align:center; margin-bottom:8px; font-weight:700; font-size:0.9rem; color:var(--accent-gold);">LUMEN INTESTINAL (alta [glucosa] después de comer)</div>
      <div class="apical-side">
        🟡 MEMBRANA APICAL (microvellosidades)
      </div>
      <div style="display:flex; justify-content:center; padding:8px 0;">
        <div class="protein-in-membrane" style="background:rgba(17,138,178,0.15); border:1px solid rgba(17,138,178,0.3);">
          <span style="font-size:1.4rem;">⇉</span>
          <strong style="color:var(--accent-secondary);">SGLT1</strong>
          <span style="font-size:0.75rem; color:var(--text-secondary);">Simporte Na⁺/Glucosa</span>
          <span style="font-size:0.75rem; color:var(--text-secondary);">T.A. Secundario</span>
        </div>
      </div>

      <div style="text-align:center; padding:16px; background:rgba(6,214,160,0.05); border-radius:10px; margin:8px 0;">
        <div style="font-weight:700; color:var(--accent-primary); margin-bottom:4px;">🏠 INTERIOR DEL ENTEROCITO</div>
        <span style="font-size:0.82rem; color:var(--text-secondary);">Glucosa se acumula aquí gracias a SGLT1 (entra con Na⁺)</span>
      </div>

      <div style="display:flex; justify-content:center; gap:16px; padding:8px 0; flex-wrap:wrap;">
        <div class="protein-in-membrane" style="background:rgba(131,56,236,0.15); border:1px solid rgba(131,56,236,0.3);">
          <span style="font-size:1.4rem;">➡️</span>
          <strong style="color:var(--accent-purple);">GLUT2</strong>
          <span style="font-size:0.75rem; color:var(--text-secondary);">Uniporte (difusión facilitada)</span>
          <span style="font-size:0.75rem; color:var(--text-secondary);">T. Pasivo</span>
        </div>
        <div class="protein-in-membrane" style="background:rgba(239,71,111,0.15); border:1px solid rgba(239,71,111,0.3);">
          <span style="font-size:1.4rem;">🔋</span>
          <strong style="color:var(--accent-warm);">Na⁺/K⁺-ATPasa</strong>
          <span style="font-size:0.75rem; color:var(--text-secondary);">Bomba tipo P</span>
          <span style="font-size:0.75rem; color:var(--text-secondary);">Mantiene gradiente Na⁺</span>
        </div>
      </div>
      <div class="basolateral-side">
        🟣 MEMBRANA BASOLATERAL
      </div>
      <div style="text-align:center; margin-top:8px; font-weight:700; font-size:0.9rem; color:var(--accent-purple);">SANGRE / CAPILARES (glucosa va hacia la sangre)</div>
    </div>
  </div>

  <div class="card card-gold">
    <h3>🔑 ¿Por qué esta distribución?</h3>
    <div class="key-concept">
      <div class="label">Lógica fisiológica</div>
      <p><strong>SGLT1 en apical:</strong> Necesita transporte ACTIVO (secundario) para absorber glucosa del lumen incluso cuando la concentración luminal es baja. El Na⁺ que entra con la glucosa proviene del gradiente creado por la Na⁺/K⁺-ATPasa basolateral.</p>
    </div>
    <div class="key-concept" style="margin-top:8px">
      <div class="label">Salida a la sangre</div>
      <p><strong>GLUT2 en basolateral:</strong> Una vez que la glucosa se concentra dentro del enterocito, sale pasivamente por GLUT2 (difusión facilitada, a favor del gradiente) hacia los capilares sanguíneos. No necesita energía adicional.</p>
    </div>
    <div class="key-concept-warm" style="margin-top:8px; padding:14px; border-radius:10px; background:rgba(239,71,111,0.08); border:1px solid rgba(239,71,111,0.2);">
      <div class="label" style="color:var(--accent-warm); font-size:0.7rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;">Na⁺/K⁺-ATPasa en basolateral</div>

    </div>
  </div>

  <div class="card">
    <h3>🩸 Aplicación en Túbulo Renal Proximal</h3>
    <p>El mismo principio opera en el riñón: <strong>SGLT2</strong> (90% de reabsorción) y <strong>SGLT1</strong> (10% restante) están en la membrana apical del túbulo proximal, mientras que <strong>GLUT2</strong> y <strong>GLUT1</strong> están en la basolateral, con la Na⁺/K⁺-ATPasa basolateral manteniendo el gradiente.</p>

    <div class="clinical-case">
      <span class="case-badge">🩺 Correlación clínica</span>
      <p style="color:var(--text-primary)"><strong>Glucosuria renal familiar:</strong> Mutaciones en SGLT2 causan pérdida de glucosa en orina sin hiperglucemia. Es benigna, pero nos enseñó que este transportador es esencial para la reabsorción renal de glucosa, lo cual llevó al desarrollo de las gliflozinas para tratar diabetes.</p>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="card">
    <h3>🧪 Pregunta de Integración</h3>
    <p>Si se inhibe la Na⁺/K⁺-ATPasa basolateral de un enterocito con ouabaína, ¿qué sucede con la absorción de glucosa por SGLT1?</p>
    ${quizOption('gluc1', 'a', 'A) No se afecta porque SGLT1 no usa ATP', false, 'Aunque SGLT1 no usa ATP directamente, depende del gradiente de Na⁺ que genera la Na⁺/K⁺-ATPasa.')}
    ${quizOption('gluc1', 'b', 'B) Se detiene porque se pierde el gradiente de Na⁺', true, 'Correcto: sin Na⁺/K⁺-ATPasa, el Na⁺ se acumula dentro de la célula, el gradiente desaparece, y SGLT1 no puede funcionar. Esto demuestra la dependencia del T.A. secundario respecto al primario.')}
    ${quizOption('gluc1', 'c', 'C) Se revierte: la glucosa sale al lumen', false, 'SGLT1 no revierte fácilmente. Simplemente se detiene el transporte.')}
    ${quizOption('gluc1', 'd', 'D) Aumenta porque hay más Na⁺ intracelular', false, 'Más Na⁺ intracelular reduce el gradiente, lo cual disminuye (no aumenta) el transporte por SGLT1.')}
    ${quizFeedback('gluc1')}
  </div>

  ${navButtons(5, 7, 'CFTR →')}
  `;
}

function renderCFTR() {
  return `
  <div class="card card-highlight">
    <span class="section-icon">🫁</span>

  </div>

  <div class="card">
    <div class="key-concept">
      <div class="label">¿Qué es CFTR?</div>
      <p><strong>CFTR</strong> (Cystic Fibrosis Transmembrane Conductance Regulator) es un miembro de la familia <strong>ABC</strong>, pero es <strong>atípico</strong>: en lugar de funcionar como bomba, actúa como un <strong>canal de Cl⁻</strong> regulado por ATP y fosforilación por PKA (proteína cinasa A).</p>
    </div>
  </div>

  <div class="card">
    <h3>⚙️ Mecanismo de Funcionamiento</h3>
    <div class="diagram-container" style="text-align:left">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="background:var(--accent-secondary); color:#000; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:0.85rem;">1</span>
          <span style="font-size:0.88rem;">Un estímulo (ej. AMPc) activa <strong>PKA</strong>, que fosforila el dominio regulador (R) de CFTR.</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="background:var(--accent-primary); color:#000; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:0.85rem;">2</span>
          <span style="font-size:0.88rem;"><strong>ATP se une</strong> a los dominios NBD → dimerización → apertura del canal.</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="background:var(--accent-gold); color:#000; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:0.85rem;">3</span>
          <span style="font-size:0.88rem;"><strong>Cl⁻ fluye</strong> a favor de su gradiente electroquímico a través del poro (es un canal, no una bomba).</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="background:var(--accent-warm); color:#000; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:0.85rem;">4</span>
          <span style="font-size:0.88rem;">Hidrólisis de ATP → cierre del canal. El ciclo se repite.</span>
        </div>
      </div>
    </div>

    <div class="key-concept-gold" style="margin-top:12px; padding:14px; border-radius:10px; background:rgba(255,209,102,0.08); border:1px solid rgba(255,209,102,0.2);">
      <div class="label" style="color:var(--accent-gold); font-size:0.7rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;">⚠️ Punto clave</div>
      <p style="color:var(--text-primary); font-size:0.88rem; margin:0;">CFTR usa ATP para <strong>regular la apertura</strong> del canal, NO para mover Cl⁻ contra gradiente. El movimiento de Cl⁻ es pasivo. Es por eso que se le llama un transportador ABC "atípico".</p>
    </div>
  </div>

  <div class="card card-warm">
    <h3>🩺 Fibrosis Quística: La Enfermedad</h3>
    <div class="clinical-case">
      <span class="case-badge">Caso Clínico Integrador</span>
      <p style="color:var(--text-primary)">Un lactante de 3 meses es traído por sus padres por <strong>tos persistente, infecciones respiratorias recurrentes</strong> y <strong>falla de medro</strong> (no gana peso). El pediatra nota piel salada al besarlo. Se solicita una prueba de <strong>cloro en sudor</strong> que resulta >60 mEq/L (positiva). Se diagnostica <strong>Fibrosis Quística</strong>.</p>
    </div>

    <h4 style="margin-top:14px; color:var(--accent-warm);">¿Qué está pasando a nivel celular?</h4>
    <p>La mutación más común es <strong>ΔF508</strong> (deleción de fenilalanina en posición 508): la proteína CFTR no se pliega correctamente → no llega a la membrana apical → no hay canal de Cl⁻ funcional.</p>

    <div style="margin-top:12px">
      <strong style="color:var(--text-primary); font-size:0.88rem;">Consecuencias por órgano:</strong>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
        <div style="background:var(--bg-card-alt); padding:10px 12px; border-radius:10px; font-size:0.84rem;">
          <strong style="color:var(--accent-secondary);">🫁 Pulmones</strong><br>
          <span style="color:var(--text-secondary)">Sin Cl⁻ en el lumen → no sale agua → moco espeso → infecciones crónicas (Pseudomonas)</span>
        </div>
        <div style="background:var(--bg-card-alt); padding:10px 12px; border-radius:10px; font-size:0.84rem;">
          <strong style="color:var(--accent-gold);">🫀 Páncreas</strong><br>
          <span style="color:var(--text-secondary)">Secreciones espesas obstruyen conductos → pancreatitis, insuficiencia pancreática exocrina, malabsorción</span>
        </div>
        <div style="background:var(--bg-card-alt); padding:10px 12px; border-radius:10px; font-size:0.84rem;">
          <strong style="color:var(--accent-primary);">💧 Glándulas sudoríparas</strong><br>
          <span style="color:var(--text-secondary)">No se reabsorbe Cl⁻ del sudor → sudor salado (base de la prueba diagnóstica)</span>
        </div>
        <div style="background:var(--bg-card-alt); padding:10px 12px; border-radius:10px; font-size:0.84rem;">
          <strong style="color:var(--accent-warm);">🍽️ Intestino</strong><br>
          <span style="color:var(--text-secondary)">Íleo meconial en neonatos, obstrucción intestinal</span>
        </div>
      </div>
    </div>

    <div class="key-concept" style="margin-top:14px">
      <div class="label">Terapias modernas</div>
      <p><strong>Ivacaftor</strong> (potenciador): aumenta la apertura de canales CFTR mutantes que sí llegan a la membrana. <strong>Lumacaftor/Tezacaftor</strong> (correctores): ayudan al plegamiento de CFTR-ΔF508 para que llegue a la membrana. <strong>Elexacaftor + Tezacaftor + Ivacaftor (Trikafta)</strong>: la triple terapia que ha revolucionado el tratamiento de FQ.</p>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="card">
    <h3>🧪 Pregunta sobre CFTR</h3>
    <p>¿Cuál de las siguientes afirmaciones sobre CFTR es CORRECTA?</p>
    ${quizOption('cftr1', 'a', 'A) CFTR es una bomba que transporta Cl⁻ contra su gradiente', false, 'CFTR es un canal, no una bomba. El Cl⁻ fluye a favor de su gradiente.')}
    ${quizOption('cftr1', 'b', 'B) CFTR es un canal de Cl⁻ regulado por ATP y fosforilación, miembro de la familia ABC', true, 'Correcto: es un miembro atípico de la familia ABC que funciona como canal de Cl⁻. El ATP regula la apertura del canal, pero el movimiento de Cl⁻ es pasivo.')}
    ${quizOption('cftr1', 'c', 'C) La mutación ΔF508 causa hiperactividad del canal CFTR', false, 'Al contrario: ΔF508 causa que CFTR no se pliegue bien y no llegue a la membrana → pérdida de función.')}
    ${quizOption('cftr1', 'd', 'D) CFTR se ubica exclusivamente en células pulmonares', false, 'CFTR se expresa en muchos epitelios: pulmones, páncreas, intestino, glándulas sudoríparas, sistema reproductivo.')}
    ${quizFeedback('cftr1')}
  </div>

  ${navButtons(6, 8, 'Evaluación Final →')}
  `;
}
