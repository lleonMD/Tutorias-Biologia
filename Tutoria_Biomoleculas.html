        // Separate Timer component to isolate re-renders
        function Timer({ initialMinutes = 60 }) {
            const [displayTime, setDisplayTime] = useState(initialMinutes * 60);
            const timerRef = useRef(null);
            const startTimeRef = useRef(Date.now());
            const initialSecondsRef = useRef(initialMinutes * 60);

            useEffect(() => {
                timerRef.current = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTimeRef.current) / 1000);
                    const remaining = Math.max(0, initialSecondsRef.current - elapsed);
                    setDisplayTime(remaining);
                    if (remaining <= 0) {
                        clearInterval(timerRef.current);
                    }
                }, 1000);

                return () => {
                    if (timerRef.current) {
                        clearInterval(timerRef.current);
                    }
                };
            }, []);

            const minutes = Math.floor(displayTime / 60);
            const seconds = displayTime % 60;

            return (
                <div className="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg">
                    <span className="text-cyan-400">⏱️</span>
                    <span className="font-mono text-white">{minutes}:{String(seconds).padStart(2, '0')}</span>
                </div>
            );
        }

                                <span className="bg-amber-600 text-white w-6 h-6 rounded flex items-center justify-center text-sm font-bold inline-block mr-2">3</span>
                                <span className="font-bold text-amber-400 text-sm">Ruptura: HIDRÓLISIS</span>
                                <p className="text-slate-300 text-xs mt-1">Se añade H₂O para romper</p>
                            </div>
                            <div className="bg-slate-700/50 rounded-lg p-3 border-l-4 border-green-500">
                                <span className="bg-green-600 text-white w-6 h-6 rounded flex items-center justify-center text-sm font-bold inline-block mr-2">4</span>
                                <span className="font-bold text-green-400 text-sm">Requiere ENERGÍA</span>
                                <p className="text-slate-300 text-xs mt-1">ATP necesario</p>
                            </div>
                            <div className="bg-slate-700/50 rounded-lg p-3 border-l-4 border-purple-500">
                                <span className="bg-purple-600 text-white w-6 h-6 rounded flex items-center justify-center text-sm font-bold inline-block mr-2">5</span>
                                <span className="font-bold text-purple-400 text-sm">Catalizada ENZIMAS</span>
                                <p className="text-slate-300 text-xs mt-1">ADN pol, ribosoma</p>
                            </div>
                            <div className="bg-slate-700/50 rounded-lg p-3 border-l-4 border-red-500">
                                <span className="bg-red-600 text-white w-6 h-6 rounded flex items-center justify-center text-sm font-bold inline-block mr-2">6</span>
                                <span className="font-bold text-red-400 text-sm">DIRECCIONALIDAD</span>
                                <p className="text-slate-300 text-xs mt-1">5'→3' | N→C</p>
                            </div>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <button onClick={() => setSeccion('niveles')} className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl">← Anterior</button>
                        <button onClick={() => setSeccion('autoensamblaje')} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl">Siguiente →</button>
                    </div>
                </div>
            );

            const Autoensamblaje = () => (
                <div className="space-y-6 slide-in">
                    <div className="bg-slate-800 rounded-2xl p-6">
                        <h2 className="text-2xl font-bold mb-2 text-emerald-300">🏗️ Autoensamblaje</h2>
                        <p className="text-slate-400 mb-4">RA 9</p>
                        <div className="bg-purple-900/40 rounded-xl p-5 border border-purple-500/50 mb-6">
                            <h3 className="font-bold text-purple-400 mb-2">📖 Definición</h3>
                            <p className="text-white">Organización <strong className="text-purple-300">ESPONTÁNEA</strong> de macromoléculas en estructuras complejas, sin energía externa.</p>
                            <p className="text-cyan-300 text-sm mt-2">🔑 Por enlaces NO covalentes: puentes H, hidrofóbicos, van der Waals, iónicos</p>
                        </div>
                        <div className="grid grid-cols-3 gap-2 mb-4">
                            <div className="bg-slate-700/50 rounded p-2 text-center"><span className="text-xl">🧫</span><p className="text-cyan-400 text-xs">Membrana</p></div>
                            <div className="bg-slate-700/50 rounded p-2 text-center"><span className="text-xl">🧬</span><p className="text-pink-400 text-xs">Doble hélice ADN</p></div>
                            <div className="bg-slate-700/50 rounded p-2 text-center"><span className="text-xl">🔴</span><p className="text-amber-400 text-xs">Ribosomas</p></div>
                            <div className="bg-slate-700/50 rounded p-2 text-center"><span className="text-xl">🧵</span><p className="text-green-400 text-xs">Microtúbulos</p></div>
                            <div className="bg-slate-700/50 rounded p-2 text-center"><span className="text-xl">🦠</span><p className="text-purple-400 text-xs">Cápsides virales</p></div>
                            <div className="bg-slate-700/50 rounded p-2 text-center"><span className="text-xl">🥩</span><p className="text-red-400 text-xs">Plegamiento 3D</p></div>
                        </div>
                        <div className="bg-emerald-900/30 rounded-xl p-4 border border-emerald-500/40">
                            <h4 className="font-bold text-emerald-400 mb-2">🌟 Importancia</h4>
                            <p className="text-slate-300 text-xs">Eficiencia energética • Rapidez • Fidelidad • Reversibilidad</p>
                            <p className="text-amber-300 text-xs mt-2">🔗 Permite pasar del Nivel 2 al Nivel 3 (complejos supramoleculares)</p>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <button onClick={() => setSeccion('polimerizacion')} className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl">← Anterior</button>
                        <button onClick={() => setSeccion('clinica')} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl">Siguiente →</button>
                    </div>
                </div>
            );

            const Clinica = () => {
                const [casoIdx, setCasoIdx] = useState(0);
                const [respuesta, setRespuesta] = useState(null);
                const caso = casosClinicosData[casoIdx];
                return (
                    <div className="space-y-6 slide-in">
                        <div className="bg-red-900/40 rounded-2xl p-5 border border-red-500/50">
                            <h2 className="text-2xl font-bold text-red-300">🏥 Casos Clínicos</h2>
                        </div>
                        <div className="bg-slate-800 rounded-2xl p-5">
                            <span className="text-xs bg-red-600 px-2 py-1 rounded-full">Caso {casoIdx + 1}/{casosClinicosData.length}</span>
                            <h3 className="text-lg font-bold text-white mt-2 mb-3">{caso.titulo}</h3>
                            <div className="bg-slate-700/50 rounded-xl p-4 mb-4">
                                <p className="text-slate-300 text-sm mb-2"><strong>👤</strong> {caso.paciente}</p>
                                <p className="text-slate-300 text-sm mb-2">{caso.historia}</p>
                                <p className="text-pink-400 text-sm"><strong>Síntomas:</strong> {caso.sintomas}</p>
                            </div>
                            <div className="bg-cyan-900/30 rounded-xl p-4 mb-4 border border-cyan-500/50">
                                <p className="text-cyan-300 font-medium mb-3 text-sm">❓ {caso.pregunta}</p>
                                <div className="grid grid-cols-2 gap-2">
                                    {caso.opciones.map(op => (
                                        <button key={op.id} onClick={() => setRespuesta(op.id)} disabled={respuesta !== null}
                                            className={`p-2 rounded-lg text-left text-sm ${respuesta === op.id ? (op.correcto ? 'bg-green-600' : 'bg-red-600') : respuesta && op.correcto ? 'bg-green-600/50' : 'bg-slate-600 hover:bg-slate-500'}`}>
                                            {op.id}) {op.texto}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            {respuesta && (
                                <div className="space-y-3">
                                    <div className="bg-green-900/30 border border-green-500 rounded-xl p-3">
                                        <p className="text-green-300 text-sm">{caso.explicacion}</p>
                                    </div>
                                    <div className="bg-purple-900/30 border border-purple-500 rounded-xl p-3">
                                        <p className="text-purple-300 text-sm">🔬 {caso.conexion}</p>
                                    </div>
                                    {casoIdx < casosClinicosData.length - 1 && (
                                        <button onClick={() => { setCasoIdx(casoIdx + 1); setRespuesta(null); }} className="w-full py-2 bg-cyan-600 hover:bg-cyan-500 rounded-xl text-sm">Siguiente caso →</button>
                                    )}
                                </div>
                            )}
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setSeccion('autoensamblaje')} className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl">← Anterior</button>
                            <button onClick={() => setSeccion('evaluacion')} className="flex-1 py-3 bg-green-600 hover:bg-green-500 rounded-xl">Evaluación →</button>
                        </div>
                    </div>
                );
            };

            const Evaluacion = () => {
                const [resp, setResp] = useState({});
                const [mostrar, setMostrar] = useState(false);
                const preguntas = [
                    { id: 1, q: '¿Cuál NO es polímero?', ops: [{id:'a',t:'Proteínas',c:false},{id:'b',t:'Polisacáridos',c:false},{id:'c',t:'Lípidos',c:true},{id:'d',t:'Ác. nucleicos',c:false}] },
                    { id: 2, q: '¿Qué se libera en condensación?', ops: [{id:'a',t:'ATP',c:false},{id:'b',t:'CO₂',c:false},{id:'c',t:'H₂O',c:true},{id:'d',t:'O₂',c:false}] },
                    { id: 3, q: 'Nivel de ribosomas (Becker)', ops: [{id:'a',t:'Nivel 1',c:false},{id:'b',t:'Nivel 2',c:false},{id:'c',t:'Nivel 3',c:true},{id:'d',t:'Nivel 4',c:false}] },
                    { id: 4, q: 'Monómero de proteínas', ops: [{id:'a',t:'Nucleótidos',c:false},{id:'b',t:'Monosacáridos',c:false},{id:'c',t:'Aminoácidos',c:true},{id:'d',t:'Ác. grasos',c:false}] },
                    { id: 5, q: 'Enlaces de autoensamblaje', ops: [{id:'a',t:'Covalentes',c:false},{id:'b',t:'No covalentes',c:true},{id:'c',t:'Iónicos solo',c:false},{id:'d',t:'Metálicos',c:false}] },
                    { id: 6, q: 'NO es principio polimerización', ops: [{id:'a',t:'Requiere ATP',c:false},{id:'b',t:'Enzimas',c:false},{id:'c',t:'Espontánea',c:true},{id:'d',t:'Direccionalidad',c:false}] },
                    { id: 7, q: 'Elementos exclusivos proteínas', ops: [{id:'a',t:'C,H',c:false},{id:'b',t:'N,S',c:true},{id:'c',t:'O',c:false},{id:'d',t:'P',c:false}] },
                    { id: 8, q: 'Sentido restringido son:', ops: [{id:'a',t:'Agua/sales',c:false},{id:'b',t:'Solo proteínas',c:false},{id:'c',t:'4 macromoléculas',c:true},{id:'d',t:'Todo',c:false}] },
                    { id: 9, q: 'Enlace en ADN', ops: [{id:'a',t:'Peptídico',c:false},{id:'b',t:'Glucosídico',c:false},{id:'c',t:'Fosfodiéster',c:true},{id:'d',t:'Éster',c:false}] },
                    { id: 10, q: 'Bicapa lipídica se forma por:', ops: [{id:'a',t:'Polimerización',c:false},{id:'b',t:'Hidrólisis',c:false},{id:'c',t:'Autoensamblaje',c:true},{id:'d',t:'Condensación',c:false}] }
                ];
                const puntaje = () => preguntas.filter(p => resp[p.id] === p.ops.find(o => o.c).id).length;
                return (
                    <div className="space-y-4 slide-in">
                        <div className="bg-green-900/40 rounded-2xl p-5 border border-green-500/50">
                            <h2 className="text-2xl font-bold text-green-300">✅ Evaluación Final</h2>
                        </div>
                        {preguntas.map((p, idx) => (
                            <div key={p.id} className="bg-slate-800 rounded-xl p-4">
                                <p className="font-medium text-white mb-2 text-sm"><span className="text-emerald-400">{idx + 1}.</span> {p.q}</p>
                                <div className="grid grid-cols-2 gap-2">
                                    {p.ops.map(op => (
                                        <button key={op.id} onClick={() => !mostrar && setResp({...resp, [p.id]: op.id})} disabled={mostrar}
                                            className={`p-2 rounded-lg text-left text-xs ${mostrar && op.c ? 'bg-green-600' : mostrar && resp[p.id] === op.id && !op.c ? 'bg-red-600' : resp[p.id] === op.id ? 'bg-emerald-600' : 'bg-slate-700 hover:bg-slate-600'}`}>
                                            {op.id}) {op.t}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ))}
                        <div className="flex justify-center">
                            {!mostrar ? (
                                <button onClick={() => setMostrar(true)} disabled={Object.keys(resp).length < preguntas.length} className="px-6 py-3 bg-green-600 hover:bg-green-500 disabled:bg-slate-600 rounded-xl font-bold">Ver Resultados</button>
                            ) : (
                                <div className="text-center bg-slate-800 rounded-xl p-5 w-full">
                                    <div className="text-4xl font-bold mb-2">{puntaje()} / {preguntas.length}</div>
                                    <p className="text-xl mb-3">{puntaje() === 10 ? '🎉 ¡Perfecto!' : puntaje() >= 8 ? '👏 ¡Excelente!' : puntaje() >= 6 ? '👍 ¡Bien!' : '💪 ¡Sigue!'}</p>
                                    <div className="bg-slate-700/50 rounded-xl p-3 text-left text-xs">
                                        <p className="font-bold text-emerald-400 mb-2">RA Cubiertos:</p>
                                        <p className="text-slate-300">RA1-9: Definición, 4 macromoléculas, sentido amplio/restringido, monómeros/polímeros, moléculas simples, polimerización, 5 niveles, 6 principios, autoensamblaje</p>
                                    </div>
                                    <button onClick={() => { setResp({}); setMostrar(false); }} className="mt-3 px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded-lg text-sm">Reintentar</button>
                                </div>
                            )}
                        </div>
                        <button onClick={() => setSeccion('clinica')} className="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl">← Volver</button>
                    </div>
                );
            };

            return (
                <div className="min-h-screen text-white">
                    <BarraProgreso />
                    <Glosario />
                    <div className="pt-24 pb-20 px-4 max-w-4xl mx-auto">
                        {seccion === 'inicio' && <Inicio />}
                        {seccion === 'definicion' && <Definicion />}
                        {seccion === 'macromoleculas' && <Macromoleculas />}
                        {seccion === 'monomeros' && <Monomeros />}
                        {seccion === 'niveles' && <Niveles />}
                        {seccion === 'polimerizacion' && <Polimerizacion />}
                        {seccion === 'autoensamblaje' && <Autoensamblaje />}
                        {seccion === 'clinica' && <Clinica />}
                        {seccion === 'evaluacion' && <Evaluacion />}
                    </div>
                    <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-700 p-3">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <span className="text-slate-400 text-sm">📝</span>
                                <input type="text" value={notas} onChange={(e) => setNotas(e.target.value)} placeholder="Notas..." className="bg-slate-800 border border-slate-600 rounded-lg px-3 py-1 text-sm w-48 focus:outline-none focus:border-emerald-500" />
                            </div>
                            <span className="text-slate-500 text-xs">Tutoría Biomoléculas</span>
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.render(<TutoriaBiomoleculas />, document.getElementById('root'));
    </script>
</body>
</html>
